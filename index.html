<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ポーカー勝率計算機</title>
<style>
  :root { --bg: #f5f3ee; --fg: #222; --sub: #666; --card: #fff; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1d1f; --fg: #eee; --sub: #aaa; --card: #26292c; --line: #3a3d40; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Meiryo", "メイリオ", sans-serif; line-height: 1.8; }
  main { max-width: 32em; margin: 12vh auto 0; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.25em; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  .sub { color: var(--sub); font-size: .9em; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>ポーカー勝率計算機の公開を終了しました</h1>
    <p>このページでの勝率計算機の公開は終了しました。これまで使っていただき、ありがとうございました。</p>
    <p class="sub">ホーム画面に追加していた場合は、アイコンを削除してください。</p>
  </div>
</main>
<script>
  // 前の版の service worker と保存した画面を消す
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  }
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
