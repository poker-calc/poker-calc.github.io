}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

/* 役ができる率(静かな小さい枠) */

<script>
// ENGINE START —— カードは 0〜51 の整数。rank = c>>2(0=2 … 12=A)、suit = c&3
const RANKS = "23456789TJQKA", SUITS = "cdhs", SUIT_MARK = ["♣", "♦", "♥", "♠"];
const BASE = 1 << 20;
const STRAIGHT_TOP = new Int8Array(8192).fill(-1);
for (let top = 4; top <= 12; top++) STRAIGHT_TOP[0b11111 << (top - 4)] = top;
STRAIGHT_TOP[0b1000000001111] = 3;   // A-2-3-4-5(ホイール)
const CNT = new Int8Array(13);

function rank5(a, b, c, d, e) {
  // 5枚の役を整数にする(大きいほど強い)。区分: 0ハイ 1ワンペア 2ツーペア 3トリップス 4ストレート 5フラッシュ 6フルハウス 7フォーカード 8ストレートフラッシュ
  const s = a & 3, fl = (b & 3) === s && (c & 3) === s && (d & 3) === s && (e & 3) === s;
  const ra = a >> 2, rb = b >> 2, rc = c >> 2, rd = d >> 2, re = e >> 2;
  const mask = (1 << ra) | (1 << rb) | (1 << rc) | (1 << rd) | (1 << re);
  let n = 0; for (let m = mask; m; m &= m - 1) n++;
  if (n === 5) {
    const st = STRAIGHT_TOP[mask];
    if (st >= 0) return (fl ? 8 : 4) * BASE + st;
    return (fl ? 5 : 0) * BASE + mask;
  }
  CNT[ra]++; CNT[rb]++; CNT[rc]++; CNT[rd]++; CNT[re]++;
  let q = -1, t = -1, p1 = -1, p2 = -1, k1 = -1, k2 = -1, k3 = -1;
  for (let r = 12; r >= 0; r--) {
    const x = CNT[r];
    if (!x) continue;
    CNT[r] = 0;
    if (x === 4) q = r;
    else if (x === 3) t = r;
    else if (x === 2) { if (p1 < 0) p1 = r; else p2 = r; }
    else { if (k1 < 0) k1 = r; else if (k2 < 0) k2 = r; else k3 = r; }
  }
  if (q >= 0) return 7 * BASE + q * 13 + k1;
  if (t >= 0 && p1 >= 0) return 6 * BASE + t * 13 + p1;
  if (t >= 0) return 3 * BASE + t * 169 + k1 * 13 + k2;
  if (p2 >= 0) return 2 * BASE + p1 * 169 + p2 * 13 + k1;
  return 1 * BASE + p1 * 2197 + k1 * 169 + k2 * 13 + k3;
}

const C7 = [];   // 7枚から5枚を選ぶ21通り
for (let a = 0; a < 7; a++) for (let b = a + 1; b < 7; b++) C7.push([...Array(7).keys()].filter(i => i !== a && i !== b));
const B3 = [];   // ボード5枚から3枚の10通り
for (let a = 0; a < 5; a++) for (let b = a + 1; b < 5; b++) for (let c = b + 1; c < 5; c++) B3.push([a, b, c]);
function pairsOf(n) { const o = []; for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) o.push([a, b]); return o; }
const HP = { 4: pairsOf(4), 5: pairsOf(5) };

function bestHoldem(h, bd) {
  const x = [h[0], h[1], bd[0], bd[1], bd[2], bd[3], bd[4]];
  let best = 0;
  for (const k of C7) { const v = rank5(x[k[0]], x[k[1]], x[k[2]], x[k[3]], x[k[4]]); if (v > best) best = v; }
  return best;
}
function bestOmaha(h, bd) {
  // オマハは手札からちょうど2枚、ボードからちょうど3枚
  let best = 0;
  const hp = HP[h.length];
  for (const t of B3) {
    const b0 = bd[t[0]], b1 = bd[t[1]], b2 = bd[t[2]];
    for (const p of hp) { const v = rank5(h[p[0]], h[p[1]], b0, b1, b2); if (v > best) best = v; }
  }
  return best;
}

function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

function* combos(arr, k, start = 0, cur = []) {
  if (cur.length === k) { yield cur.slice(); return; }
  for (let i = start; i <= arr.length - (k - cur.length); i++) { cur.push(arr[i]); yield* combos(arr, k, i + 1, cur); cur.pop(); }
}
function nCk(n, k) { let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return Math.round(r); }

// ---- 相手のレンジ(手の範囲)
// ホールデムの169種類は 13×13 のマスで表す。idx = i*13+j(i, j は 0 が A、12 が 2)。
// i === j はペア、i < j(右上)はスーテッド、i > j(左下)はオフスート
function nlhClassName(idx) {
  const i = Math.floor(idx / 13), j = idx % 13, hi = RANKS[12 - Math.min(i, j)], lo = RANKS[12 - Math.max(i, j)];
  return i === j ? hi + lo : hi + lo + (i < j ? "s" : "o");
}
function nlhClassCombos(idx) {
  const i = Math.floor(idx / 13), j = idx % 13, r1 = 12 - Math.min(i, j), r2 = 12 - Math.max(i, j), out = [];
  if (i === j) { for (let s = 0; s < 4; s++) for (let t = s + 1; t < 4; t++) out.push([r1 * 4 + s, r1 * 4 + t]); }
  else if (i < j) { for (let s = 0; s < 4; s++) out.push([r1 * 4 + s, r2 * 4 + s]); }
  else { for (let s = 0; s < 4; s++) for (let t = 0; t < 4; t++) if (s !== t) out.push([r1 * 4 + s, r2 * 4 + t]); }
  return out;
}

// PLO の手の特徴(参加率の並びを当てる式に使う)。戻り値の0番は定数項
const PLO_FEATURE_NAMES = ["定数", "Aあり", "Kあり", "Qあり", "Jあり", "Tあり", "数字の高さの合計", "AAペア", "KKペア", "QQペア", "JJ・TTペア", "99以下のペアの数",
  "ペアの数", "同じ数字3枚以上", "2枚以上そろったマークの数", "同じマーク3枚以上", "同じマーク4枚以上", "Aのスーテッド", "Kのスーテッド(Aなし)",
  "1つ違いの組", "2つ違いの組", "3つ違いの組", "4つ違いの組", "5段の幅に入る数字の最多", "2〜5のカードの数", "ダブルスーテッド", "つながりの高さ"];
function ploFeatures(h) {
  const cnt = new Int8Array(13), sc = new Int8Array(4);
  let mask = 0;
  for (const c of h) { cnt[c >> 2]++; sc[c & 3]++; mask |= 1 << (c >> 2); }
  const f = new Float64Array(PLO_FEATURE_NAMES.length);
  f[0] = 1;
  f[1] = cnt[12] > 0; f[2] = cnt[11] > 0; f[3] = cnt[10] > 0; f[4] = cnt[9] > 0; f[5] = cnt[8] > 0;
  let rsum = 0; for (let r = 0; r < 13; r++) if (cnt[r]) rsum += r / 12; f[6] = rsum;
  f[7] = cnt[12] >= 2; f[8] = cnt[11] >= 2; f[9] = cnt[10] >= 2; f[10] = cnt[9] >= 2 || cnt[8] >= 2;
  let small = 0, pairs = 0, trips = 0; for (let r = 0; r < 13; r++) { if (cnt[r] >= 2 && r <= 7) small++; if (cnt[r] === 2) pairs++; if (cnt[r] >= 3) trips = 1; }
  f[11] = small; f[12] = pairs; f[13] = trips;
  let groups = 0, s3 = 0, s4 = 0, as = 0, ks = 0;
  for (let s = 0; s < 4; s++) {
    if (sc[s] >= 2) groups++; if (sc[s] >= 3) s3 = 1; if (sc[s] >= 4) s4 = 1;
    if (sc[s] >= 2) { const hasA = h.some(c => c === 48 + s), hasK = h.some(c => c === 44 + s); if (hasA) as++; else if (hasK) ks++; }
  }
  f[14] = groups; f[15] = s3; f[16] = s4; f[17] = as; f[18] = ks;
  // つながり: 違う数字どうしの組の差(A は 1 としても数える)
  const rk = []; for (let r = 0; r < 13; r++) if (cnt[r]) rk.push(r);
  let hiConn = 0;
  for (let a = 0; a < rk.length; a++) for (let b = a + 1; b < rk.length; b++) {
    let d = rk[b] - rk[a]; if (rk[b] === 12) d = Math.min(d, rk[a] + 1);
    if (d >= 1 && d <= 4) { f[18 + d]++; hiConn += rk[a] / 12; }
  }
  // 5段の幅(A-5 から T-A まで)に入る違う数字の最多。ビット0 は 2 の下に置いた A
  let best = 0; const low = ((mask << 1) | ((mask >> 12) & 1)) & 0x3fff;
  for (let w = 0; w <= 9; w++) { let x = (low >> w) & 31, n = 0; for (; x; x &= x - 1) n++; if (n > best) best = n; }
  f[23] = best;
  f[24] = cnt[0] + cnt[1] + cnt[2] + cnt[3];
  f[25] = groups >= 2; f[26] = hiConn;
  return f;
}
// coef が特徴より1つ長い時(PLO5)は、最後の係数をランダウンの形(0〜1)に掛ける。同じ長さの時(PLO4)は決めた加点を足す

const infoCache = new Map();

  const got = []; const N = 20000;
  for (let i = 0; i < N; i++) {
    for (let k = 0; k < hs; k++) { const j = k + Math.floor(R() * (52 - k)); const x = d[k]; d[k] = d[j]; d[j] = x; h[k] = d[k]; }
    if (ploMatch(h, cfg)) got.push(h.slice());

      <ul class="notes"><li>AAを含む手: ${f("aa")}</li><li>ペアを含む手: ${f("pair")}</li><li>ダブルスーテッド: ${f("ds")}、シングルスーテッド: ${f("ss")}</li>
      <li>Aのスーテッドを含む手: ${f("as")}</li><li>ランダウン(ワンギャップ含む): ${f("run")}</li></ul>

      <div>境目に近い手の例: <span class="hands">${pick(sorted.slice(-Math.max(6, Math.ceil(sorted.length / 20))), 6)}</span></div>
      <div>${state.game === "plo5" ? "手の例と「上位◯%」の並び順は、作者が記録した PLO5 の対戦でショーダウンまで行った約6,000手をもとに、参加されやすい手から順に並べたものです。" : "手の例と「上位◯%」の並び順は、ランダムな1手に対する勝率に、ランダウンの加点を足した点の高い順です。加点は、数字が大きい側のランダウンほど大きくしています。"}</div>`;

function applyRangeCode(game, rc, code) {

    const m = /^p(\d{1,3})$/.exec(code);
    if (m) { const v = Math.min(100, Math.max(1, +m[1])); rc.nlh = { pct: v, cells: cellsFromPct(v) }; return true; }
    if (!NAME2IDX) { NAME2IDX = {}; for (let i = 0; i < 169; i++) NAME2IDX[nlhClassName(i).toUpperCase()] = i; }
    const cells = new Uint8Array(169);
    if (code !== "none") for (const nm of code.split("-")) { const i = NAME2IDX[nm.toUpperCase()]; if (i == null) return false; cells[i] = 1; }
    rc.nlh = { pct: null, cells };

  const m = /^p(\d{1,3})((?:[a-z]{2})*)$/.exec(code);

}

  if (game === "nlh") return m ? `上位 ${m[1]}%` : code === "none" ? "手なし" : `マスで選んだ手(${code.split("-").length}種類)`;
  const rc = newRangeCfg(); if (!applyRangeCode(game, rc, code)) return "";
  const conds = PLO_CHIPS.filter(([k]) => rc.plo[k]).map(([, l]) => l);

// ---- URL で場面を共有する(# の後ろに今の状態を入れる)
// 例: #g=plo4&h=AsAhKdKc.r&b=Th7c2h&r1=p20ds  手札は2文字ずつ、空いた枠は "__"、レンジの人は "r"

    const hands = parts.map((s, p) => modes[p] === "range" ? Array(size).fill(null) : take(s, size));

let runId = 0, autoTimer = null;
// カードを変えたら少し待って自動で計算し直す(ボタンを押さなくてよい)

// 文字で入れる: "AsKd" "as kd" "A♠K♦" "Td9d" などをカードにする
function parseCards(text) {
  const t = text.replace(/♠/g, "s").replace(/♥/g, "h").replace(/♦/g, "d").replace(/♣/g, "c").replace(/10/g, "T").replace(/[\s,]/g, "");
  const out = [];
  for (let i = 0; i + 1 < t.length; i += 2) {
    const r = RANKS.indexOf(t[i].toUpperCase()), s = SUITS.indexOf(t[i + 1].toLowerCase());
    if (r < 0 || s < 0) return null;
    out.push(r * 4 + s);
  }
  return t.length % 2 ? null : out;
}
function textInput(kind, p, size, label) {
  const inp = document.createElement("input");
  inp.className = "txt"; inp.id = "txt-" + kind + p; inp.placeholder = label; inp.autocomplete = "off"; inp.spellcheck = false;
  inp.setAttribute("aria-label", label);
  inp.onkeydown = ev => {
    if (ev.key !== "Enter") return;
    const cs = parseCards(inp.value);
    const others = new Set(); state.board.forEach(c => kind !== "b" && c != null && others.add(c));
    state.hands.forEach((h, q) => (kind === "b" || q !== p) && !isRange(q) && h.forEach(c => c != null && others.add(c)));
    // 読めない・多すぎる・重なっている、を分けて伝える(2026-11-05 どのカードが重なったか分からなかった)
    const nm = c => RANKS[c >> 2] + SUIT_MARK[c & 3];
    const dup = cs && (cs.find((c, i) => cs.indexOf(c) !== i) ?? cs.find(c => others.has(c)));
    if (!cs || cs.length > size || dup != null) {
      $("status").textContent = !cs ? "カードが読めません。「AsKd」のように、数字(A K Q J T 9…)とマーク(s h d c)の2文字ずつで入れてください。"

        : cs.indexOf(dup) !== cs.lastIndexOf(dup) ? `${nm(dup)} が2回書かれています。`

}

function setGame(g) {
  if (g === state.game) return;
  state.game = g;
  try { localStorage.setItem("eqcalc-game", g); } catch (e) {}
  const n = GAMES[g].size;
  const keep = g === "nlh" ? 9 : 6;
  for (const a of [state.hands, state.modes, state.rcfg, state.gridOpen, state.rinfoOpen, state.rpanel]) a.splice(keep);
  state.rpanel = [];
  state.hands = state.hands.map(h => Array.from({ length: n }, (_, i) => h[i] ?? null));
  state.active = { kind: "p", p: 0, i: 0 };
  changed();

// レンジの人は、毎回レンジから手を引く。戻り値 { ranges, notes } か、手が無い時は { err }
function buildRanges() {
  const ranges = [], notes = [];
  for (let p = 1; p < state.hands.length; p++) {
    if (!isRange(p)) continue;
    if (state.game === "nlh") {
      const cfg = state.rcfg[p].nlh, list = [];
      for (let i = 0; i < 169; i++) if (cfg.cells[i]) list.push(...nlhClassCombos(i));
      if (!list.length) return { err: `${pname(p)}のレンジに手が1つもありません。参加率を上げるか、マスで手を選んでください。` };
      ranges[p] = { combos: list };
    } else {
      const cfg = ploCfg(p), sh = ploShare(p);
      if (sh === 0) return { err: `${pname(p)}の条件に合う手がありません。条件を減らしてください。` };
      if (sh < 0.003) notes.push(`${pname(p)}の条件に合う手が少ないので、ゆっくり計算します。`);
      ranges[p] = { test: h => ploMatch(h, cfg) };
    }

function run() {
  const id = ++runId;
  const filled = state.board.filter(c => c != null).length;
  if (filled === 1 || filled === 2) { $("status").textContent = "ボードは 0枚・3枚(フロップ)・4枚(ターン)・5枚(リバー)のどれかにしてください。"; return; }
  const br = buildRanges();
  if (br.err) { $("status").textContent = br.err; return; }
  const { ranges, notes } = br;
  const job = makeJob(state.game, state.hands, state.board, (Date.now() ^ 0x9e3779b9) >>> 0, ranges);
  if (job.rangeEmpty) { $("status").textContent = "相手のレンジの手が、見えているカードとすべて重なっています。レンジを広げてください。"; return; }

    state.results = { n, eq: job.eq, win: job.win, tie: job.tie, trials: job.trials };
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    if (job.exact) {
      // 計算の途中は「です…。」のような文にならないよう、途中と終わりで文を分ける(2026-11-05)
      $("status").textContent = done ? `残りのカードの出方を全部(${job.total.toLocaleString()}通り)数えました。`
        : `残りのカードの出方(全部で ${job.total.toLocaleString()}通り)を数えています…`;
    } else {
      const e0 = job.eq[0] / Math.max(job.trials, 1), se = Math.sqrt(Math.max(e0 * (1 - e0), 0.0001) / Math.max(job.trials, 1));

        ? `${hasRange ? "相手のレンジから手を引きながら、" : ""}ランダムに ${job.trials.toLocaleString()}回配りました(${secs}秒)。誤差はおよそ ±${(1.96 * se * 100).toFixed(1)}%です。`
        : `ランダムに配って数えています(今 ${job.trials.toLocaleString()}回)…`)
        + (job.failed ? "レンジから手を引けなくなったので、途中で止めました。" : "") + (notes.length ? " " + notes.join(" ") : "");
    }

function resultHTML(p) {

  renderOdds(); renderMade(); renderNext();
}

// ---- 次のカードごとの勝率(ボードが3枚か4枚の時。開いた時だけ数える)
// 残りのカードを1枚ずつ次の枠に置いて、それぞれ今と同じ計算をする。全員の手札が入っていれば全部数え、そうでなければ1枚ごとにランダムに配る
const NEXT_MC = { nlh: 3000, plo4: 1000, plo5: 700 };
const nextCache = new Map(); let nextJob = null, nextTimer = null;

  return JSON.stringify([state.game, state.board, state.hands.map((h, p) => isRange(p) ? "r" + rangeCode(state.game, state.rcfg[p]) : h)]);
}
function renderNext() {
  const el = $("next"); if (!el) return;
  const nb = state.board.filter(c => c != null).length;
  if (nb !== 3 && nb !== 4) { if (el.innerHTML) el.innerHTML = ""; nextJob = null; return; }
  let det = el.querySelector("details");
  if (!det) {
    el.innerHTML = `<details${state.nextOpen ? " open" : ""}><summary>次のカードごとの勝率(${nb === 3 ? "ターン" : "リバー"})</summary><div class="nx"></div></details>`;
    det = el.querySelector("details");

  }
  if (!det.open) { nextJob = null; clearTimeout(nextTimer); return; }

  const k = J.key + "|" + state.nextSort;
  if (body.dataset.key === k) return;
  body.dataset.key = k; body.innerHTML = nextHTML(J);
  body.querySelectorAll(".seg button").forEach(b => b.onclick = () => { state.nextSort = b.dataset.s; paintNext(body, J); });
}
function nextHTML(J) {
  if (J.err) return `<div class="sub">${J.err}</div>`;
  const it = J.items.filter(x => x.job.trials > 0).map(x => ({ c: x.c, e: x.job.eq[0] / x.job.trials, n: x.job.trials }));
  if (!it.length) return `<div class="sub">相手のレンジから手をうまく引けませんでした。条件をゆるめてください。</div>`;
  const avg = it.reduce((s, x) => s + x.e, 0) / it.length;
  const se = J.exact ? 0 : Math.sqrt(Math.max(avg * (1 - avg), 0.0025) / Math.min(...it.map(x => x.n)));
  // 同じ数字のカードは、勝率がほぼ同じなら1行にまとめる(全部数えた時は 0.05% 以内、ランダムの時は誤差の範囲)
  const thr = J.exact ? 0.0005 : 5 * se, groups = [];
  for (let r = 12; r >= 0; r--) {
    let cur = null;
    for (const x of it.filter(x => x.c >> 2 === r).sort((a, b) => b.e - a.e)) {
      if (cur && cur.last - x.e <= thr) { cur.cards.push(x); cur.last = x.e; }
      else { cur = { cards: [x], last: x.e }; groups.push(cur); }
    }
  }
  for (const g of groups) { const n = g.cards.reduce((s, x) => s + x.n, 0); g.e = g.cards.reduce((s, x) => s + x.e * x.n, 0) / n; }
  if (state.nextSort === "low") groups.sort((a, b) => a.e - b.e);
  const thr2 = J.exact ? 0.0005 : 2 * se;
  const up = it.filter(x => x.e > avg + thr2).length, down = it.filter(x => x.e < avg - thr2).length;
  const rows = groups.map(g => {
    const d = (g.e - avg) * 100, cls = d * 0.01 > thr2 ? " up" : d * 0.01 < -thr2 ? " down" : "";
    const ds = Math.abs(d) < 0.05 ? "0.0" : (d > 0 ? "+" : "−") + Math.abs(d).toFixed(1);
    return `<tr><td>${g.cards.map(x => x.c).sort((a, b) => b - a).map(cardHTML).join("")}</td><td class="num">${pct(g.e)}</td><td class="num${cls}">${ds}</td></tr>`;
  }).join("");
  const sortBtn = (s, l) => `<button data-s="${s}" aria-pressed="${state.nextSort === s}">${l}</button>`;
  const notes = [];
  if (J.exact) notes.push(`全員の手札が入っているので、${J.nb === 3 ? "ターンのカードごとに、リバーまでの出方を全部数えました" : "リバーのカードを全部数えました"}。カードごとの勝率の平均は、上の自分の勝率と同じになります。`);
  else {
    notes.push(`相手のレンジか空いた枠があるので、カード1枚ごとにランダムに${J.target.toLocaleString()}回配って数えました。1枚ごとの誤差は、およそ ±${(1.96 * se * 100).toFixed(1)}%です。`);
    notes.push("誤差の範囲に入る小さな違いは、同じ行にまとめています。");
    if (J.hasRange) notes.push("相手のレンジによって、山に残りやすいカードは変わります。このため、カードごとの勝率の平均は、上の自分の勝率と少しずれることがあります。");
  }
  if (J.items.length < J.unseen) notes.push("相手のレンジの手と必ず重なるカードは、次に出ることがないので表に入れていません。");
  notes.push("同じ数字でも、マークによって勝率が変わる時は、マーク別の行に分けています。");
  notes.push("「平均との差」は、勝率が平均から何ポイント上がるか下がるかです。");
  return `<div class="made-now">残りのカード${it.length}枚で平均した勝率は ${pct(avg)} です。平均より勝率が上がるカードは${up}枚、下がるカードは${down}枚です。</div>
    <span class="seg" role="group" aria-label="並べ方">${sortBtn("rank", "数字の順")}${sortBtn("low", "勝率の低い順")}</span>
    <table class="mt"><thead><tr><th scope="col">次のカード</th><th scope="col">自分の勝率</th><th scope="col">平均との差</th></tr></thead><tbody>${rows}</tbody></table>
    <ul class="notes">${notes.map(t => `<li>${t}</li>`).join("")}</ul>`;
}

// ---- 自分の手の「役ができる率」
const madeCache = new Map(); let madePending = null;
const pct = x => x >= 0.9995 ? "100%" : (x * 100).toFixed(1) + "%";
function renderMade() {
  const el = $("made"); if (!el) return;
  const hole = state.hands[0], board = state.board.filter(c => c != null);
  el.dataset.key = el.dataset.key || "";
  const setMsg = t => { if (el.dataset.key !== t) { el.dataset.key = t; el.innerHTML = t ? `<div class="made-line">${t}</div>` : ""; } };
  if (hole.some(c => c == null)) return setMsg("自分の手札を全部入れると、役ができる率も出ます。");
  if (board.length === 1 || board.length === 2) return setMsg("");
  const dead = []; state.hands.forEach((h, p) => p > 0 && !isRange(p) && h.forEach(c => c != null && dead.push(c)));
  const key = [state.game, hole.join(","), board.join(","), dead.sort((a, b) => a - b).join(",")].join("|");
  const m = madeCache.get(key);
  if (!m) {
    setMsg("役ができる率を計算中…");
    if (madePending !== key) {
      // 少しずつ進めて、そのあいだも画面を触れるようにする。途中でカードが変わったらやめる
      madePending = key;
      const gen = madeOddsGen(state.game, hole.slice(), board, dead);
      const stepMade = () => {
        if (madePending !== key) return;
        const t0 = performance.now(); let r;
        do { r = gen.next(); } while (!r.done && performance.now() - t0 < 25);
        if (!r.done) { setTimeout(stepMade, 0); return; }
        if (madeCache.size > 300) madeCache.clear();
        madeCache.set(key, r.value); madePending = null; renderMade();
      };
      setTimeout(stepMade, 30);
    }
    return;
  }
  // 計算中は何度も呼ばれるので、中身が同じなら書き換えない(「くわしく」を押している途中で消えないように)
  const html = madeHTML(m);
  if (el.dataset.key === key && el.innerHTML) return;
  el.dataset.key = key; el.innerHTML = html;
  const d = el.querySelector("details"); if (d) d.ontoggle = () => { state.madeOpen = d.open; };
}
function madeHTML(m) {
  const plo = state.game !== "nlh";
  const now = m.now, fl = (k, lab) => now && now[k] ? `${lab} できている` : null;
  const rows = [];   // [名前, 値...]
  let line = "", head = [];
  const three = (t, lab) => ["フラッシュ", "ストレート", "フルハウス以上"].map((nm, i) => {
    const k = ["flush", "straight", "full"][i];
    return now && now[k] ? `${nm} できている` : `${nm} ${pct(t[k])}`;
  }).join("・");
  let nowTxt = "";
  if (now) {
    const parts = [];
    if (now.flush) parts.push("フラッシュ"); if (now.straight) parts.push("ストレート"); if (now.full) parts.push("フルハウス以上");
    const d = m.draw;
    if (d && d.fdOuts) parts.push(`${d.nut ? "ナッツの" : ""}フラッシュドロー(残り${d.fdOuts}枚)`);
    if (d && d.sdRanks) parts.push(`${d.sdRanks >= 2 ? (plo ? "オープンエンド・ラップ" : "オープンエンド") : "ガットショット"}(残り${d.sdOuts}枚)`);
    nowTxt = parts.length ? `今は ${parts.join("・")} です。` : "";
  }
  if (m.street === 0) {
    line = `<span class="made-k">リバーまでに</span>${three(m.river)}`;
    head = ["フロップで", "割合"];
    rows.push(["フラッシュドロー以上", pct(m.flop.fd)], ["ナッツフラッシュドロー以上", pct(m.flop.nfd)],
      ["オープンエンド以上(ストレートを含む)", pct(m.flop.oe)], ["ガットショット以上(ストレートを含む)", pct(m.flop.gs)],
      ["ツーペア以上", pct(m.flop.two)], ["セット・トリップス以上", pct(m.flop.trips)]);
    rows.push(["sep", "リバーまでに"]);
    rows.push(["フラッシュ", pct(m.river.flush)], ["ストレート", pct(m.river.straight)], ["フルハウス以上", pct(m.river.full)]);
  } else if (m.street === 3) {
    line = `<span class="made-k">リバーまでに</span>${three(m.river)}`;
    head = ["", "ターンで", "リバーまでに"];
    for (const [k, nm] of [["flush", "フラッシュ"], ["straight", "ストレート"], ["full", "フルハウス以上"]])
      rows.push(now[k] ? [nm, "できている", "できている"] : [nm, pct(m.turn[k]), pct(m.river[k])]);
  } else if (m.street === 4) {
    line = `<span class="made-k">リバーで</span>${three(m.river)}`;
    head = ["", "リバーで"];
    for (const [k, nm] of [["flush", "フラッシュ"], ["straight", "ストレート"], ["full", "フルハウス以上"]])
      rows.push([nm, now[k] ? "できている" : pct(m.river[k])]);
  } else {
    const parts = ["flush", "straight", "full"].map((k, i) => fl(k, ["フラッシュ", "ストレート", "フルハウス以上"][i])).filter(Boolean);
    return `<div class="made-line">${parts.length ? parts.join("・") : "フラッシュ・ストレート・フルハウス以上はできていません"}</div>`;
  }
  let tbl = `<table class="mt"><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>`;
  for (const r of rows) tbl += r[0] === "sep" ? `<tr><th scope="col">${r[1]}</th><th></th></tr>` : `<tr><td>${r[0]}</td>${r.slice(1).map(v => `<td class="num">${v}</td>`).join("")}</tr>`;
  tbl += "</tbody></table>";
  const how = m.street === 0 ? "フロップは全部の出方を数えました。リバーまでは、ランダムに配って数えた値です(フラッシュとストレートは15万回、フルハウス以上は4万回。誤差はおよそ ±0.3%)。" : "残りのカードの出方を全部数えました。";
  const note = `<ul class="notes">
    <li>ストレートになる数字が1種類ならガットショット、2種類以上ならオープンエンドとしています${plo ? "(PLO のラップも含みます)" : ""}。カッコの中は、その役になるカードが山に残っている枚数です。</li>
    <li>ナッツフラッシュドローは、そのマークでボードにない一番強いカードを自分が持っている形です。</li>
    <li>ほかの人のカードを入れた時は、そのカードは山にないものとして数えます。${how}</li></ul>`;
  return `${nowTxt ? `<div class="made-now">${nowTxt}</div>` : ""}<div class="made-line">${line}</div>
    <details${state.madeOpen ? " open" : ""}><summary>くわしく</summary>${tbl}${note}</details>`;
}

function renderOdds() {
  const pot = parseFloat($("pot").value), bet = parseFloat($("bet").value), out = $("oddsout");
  if (!(pot >= 0) || !(bet > 0)) { out.innerHTML = `<div class="sub">ポットとベットの額を入れてください。</div>`; return; }
  const need = bet / (pot + 2 * bet);
  // 2026-11-05 ユーザー「一旦これだけに」: 必要な勝率と自分の勝率の2行だけ出す(取る額の説明・判定の文・PLO の上限の説明は外した)
  let html = `<div>コールに必要な勝率は <b>${(need * 100).toFixed(1)}%</b> です。</div>`;
  const r = state.results;
  if (r && r.n === state.hands.length && r.trials) {
    const e = r.eq[0] / r.trials;
    html += `<div class="verdict ${e >= need ? "good" : "bad"}">自分の勝率は <b>${(e * 100).toFixed(1)}%</b> です。</div>`;
  }
  // PLO でベットがポットを超える入れ方は額の入れ間違いなので、その時だけ入れ方を案内する
  if (state.game !== "nlh" && bet > pot + 1e-9)
    html += `<div class="sub">入れたベットが、相手が打つ前のポットより大きくなっています。PLO では、1回のベットはその時のポットの額までです。相手にレイズされた時は、自分がこれから足す額を「相手のベット」に入れてください。それ以外の額は、全部「相手が打つ前のポット」に入れてください。こう入れると、ベットはポットの額を超えません。</div>`;
  out.innerHTML = html;
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setGame(b.dataset.g));
$("add").onclick = () => { state.hands.push(Array(GAMES[state.game].size).fill(null)); state.modes.push("hand"); state.rcfg.push(null); changed(); };
$("clear").onclick = () => { state.board = state.board.map(() => null); state.hands = state.hands.map(h => h.map(() => null)); state.active = { kind: "p", p: 0, i: 0 }; changed(); };
$("run").onclick = run;
$("pot").oninput = $("bet").oninput = () => { renderOdds(); syncHash(); };
$("share").onclick = shareScene;
// アドレス欄の # を書き換えて開き直した時も、その場面にする
window.addEventListener("hashchange", () => { if (location.hash !== hashString() && applyHash(location.hash)) changed(); });

// 開いた時: # に場面があればそれを出す。無ければ例(ホールデムなら AA 対 KK のプリフロップ)
(function start() {
  if (location.hash.length > 1 && applyHash(location.hash)) { render(); run(); return; }
  const C = s => RANKS.indexOf(s[0]) * 4 + SUITS.indexOf(s[1]);
  if (state.game === "nlh") state.hands = [[C("As"), C("Ah")], [C("Kd"), C("Kc")]];
  else if (state.game === "plo4") state.hands = [[C("As"), C("Ah"), C("Kd"), C("Qd")], [C("Js"), C("Ts"), C("9h"), C("8h")]];
  else state.hands = [[C("As"), C("Ah"), C("Kd"), C("Qd"), C("7c")], [C("Js"), C("Ts"), C("9h"), C("8h"), C("2c")]];
  state.active = nextEmpty();
  render(); run();
})();
</script>

<style>
#gate { display: none; max-width: 30em; margin: 10vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px }
html.locked #gate { display: block }
html.locked .wrap { display: none }
#gate h1 { margin: 0 0 10px }
#gate p { margin: 0 0 10px }
#gate input { width: 100%; font: .95rem var(--num); padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink) }
#gate button { margin-top: 10px; font: inherit; font-weight: 700; padding: 8px 20px; border: 0; border-radius: 8px; background: var(--felt); color: var(--felt-ink); cursor: pointer }
#gate .note { color: var(--muted); font-size: .85rem }
#gate .err { color: var(--bad); font-weight: 700; min-height: 1.6em }
</style>
<div id="gate">
  <h1>ポーカー勝率計算機</h1>
  <p>使うには、解放コードを入れてください。解放コードは、使い方の PDF に載っています。</p>
  <input id="gateCode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="PK1 で始まるコード">
  <div><button id="gateOk">使い始める</button></div>
  <p class="err" id="gateErr"></p>
  <p class="note">一度入れると、次からはこの端末のこのブラウザで、コードを入れずに使えます。</p>
</div>
<script>
/* ===== 解放コード：PK1＋中身7バイトと署名64バイト。秘密鍵は手元の poker_calc_sell/ にだけあり、ここには確かめる鍵しかない
   中身は 版1・期限2（2026-01-01 からの日数、0 は期限なし）・番号4。半荘ノートと同じ形で、鍵は別（2026-11-05） ===== */
const CODE_PUB = "BNfMrZaL3XivyWMICz6di2vgBsSt5mIQ5HgSEjhrJ5sHMgOFUhMSVDl0Wb0F9hJu69HGtTVWamcUejgUsK2cAfg", CODE_EPOCH = Date.UTC(2026, 0, 1);
const b64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
// 流出したコードの番号（16進8桁）。ここにあるコードは新しく入れられない。すでに解放した端末はそのまま使える
// 番号は node stop_code.js で調べる。止めたら新しいコードを作り、PDF を差し替える
const STOPPED_CODES = [];
const codeNumber = body => [...body.slice(3, 7)].map(x => x.toString(16).padStart(2, "0")).join("");
async function verifyCode(code, pub = CODE_PUB, now = Date.now(), stopped = STOPPED_CODES) {
  const m = /^PK1([A-Za-z0-9_-]{95})$/.exec(String(code || "").replace(/\s/g, ""));
  if (!m) return { ok: false };
  try {
    const b = b64u(m[1]), body = b.slice(0, 7), key = await crypto.subtle.importKey("raw", b64u(pub), { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
    if (body[0] !== 1 || !await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, b.slice(7), body)) return { ok: false };
    const days = body[1] * 256 + body[2], until = days ? CODE_EPOCH + days * 864e5 : 0;
    if (stopped.includes(codeNumber(body))) return { ok: false, stopped: true };
    return until && now >= until ? { ok: false, expired: true, until } : { ok: true, until };
  } catch (e) { return { ok: false }; }
}
if (typeof module !== "undefined") module.exports = { verifyCode, codeNumber, CODE_EPOCH, STOPPED_CODES };

(() => {
  const root = document.documentElement, KEY = "eqcalc-code", err = document.getElementById("gateErr");
  const day = t => new Date(t - 1).toISOString().slice(0, 10);
  // 入れたことのある端末は、止めたコードの一覧を見ずに確かめ直す(すでに使っている人は止めない)。期限は見る
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) verifyCode(saved, undefined, Date.now(), []).then(r => {
    if (r.ok) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    root.classList.add("locked");
    if (r.expired) err.textContent = "解放コードの期限が " + day(r.until) + " に切れました。";
  });
  document.getElementById("gateOk").onclick = async () => {
    const code = document.getElementById("gateCode").value.replace(/\s/g, "");
    const r = await verifyCode(code);
    if (!r.ok) {
      err.textContent = r.stopped ? "このコードは使えなくなりました。出品者にお問い合わせください。"
        : r.expired ? "このコードの期限は " + day(r.until) + " に切れています。"
        : "コードが違います。PDF のコードを、そのまま貼り付けてください。";
      return;
    }
    try { localStorage.setItem(KEY, code); } catch (e) {}
    err.textContent = "";
    root.classList.remove("locked");
  };
})();
</script>
